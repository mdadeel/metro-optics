<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%" fill="none">
  <rect width="600" height="600" fill="#f2f1eb"/>
  <g transform="translate(150, 210)" stroke="#394f41" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
    <!-- Left Lens -->
    <rect x="0" y="30" width="125" height="100" rx="42" fill="#e7e5dc"/>
    <!-- Right Lens -->
    <rect x="175" y="30" width="125" height="100" rx="42" fill="#e7e5dc"/>
    <!-- Bridge -->
    <path d="M125 65 Q 150 48 175 65" />
    <!-- Left Temple Hook -->
    <path d="M0 65 L -35 48 Q -48 42 -42 22" />
    <!-- Right Temple Hook -->
    <path d="M300 65 L 335 48 Q 348 42 342 22" />
    <!-- Highlights in lenses -->
    <path d="M30 60 L 55 95" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
    <path d="M205 60 L 230 95" stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.7"/>
  </g>
  <text x="300" y="405" text-anchor="middle" fill="#6a776c" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" letter-spacing="0.18em" font-weight="600" text-transform="uppercase">Metro Optics</text>
  <text x="300" y="432" text-anchor="middle" fill="#9ba59d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" letter-spacing="0.1em">Frame Preview</text>
</svg>
